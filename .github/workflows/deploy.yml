name: Continuous Deployment (AWS EKS & ECR via OIDC)

on:
  push:
    branches: [ main ]

permissions:
  id-token: write  # Crucial for GitHub OIDC federated auth
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
  ECR_REGISTRY: ${{ secrets.AWS_ECR_REGISTRY }}
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}

jobs:
  deploy-to-eks:
    name: Build, Publish to ECR & Rollout to EKS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-DevOps-Deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag & Push Backend to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/devops-backend:$IMAGE_TAG -t $ECR_REGISTRY/devops-backend:latest backend/
          docker push $ECR_REGISTRY/devops-backend:$IMAGE_TAG
          docker push $ECR_REGISTRY/devops-backend:latest

      - name: Build, Tag & Push Frontend to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/devops-frontend:$IMAGE_TAG -t $ECR_REGISTRY/devops-frontend:latest frontend/
          docker push $ECR_REGISTRY/devops-frontend:$IMAGE_TAG
          docker push $ECR_REGISTRY/devops-frontend:latest

      - name: Update Kubeconfig for Amazon EKS
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Deploy Manifests to Kubernetes
        run: |
          kubectl apply -f kubernetes/namespace.yaml
          kubectl apply -f kubernetes/service.yaml
          kubectl set image deployment/devops-backend backend=${{ env.ECR_REGISTRY }}/devops-backend:${{ github.sha }} -n cloudops-devops
          kubectl set image deployment/devops-frontend frontend=${{ env.ECR_REGISTRY }}/devops-frontend:${{ github.sha }} -n cloudops-devops

      - name: Health Check & Rollout Verification
        id: rollout
        run: |
          echo "Verifying deployment rollout status..."
          if ! kubectl rollout status deployment/devops-backend -n cloudops-devops --timeout=180s; then
            echo "::error::Deployment failed health checks! Triggering automated rollback..."
            kubectl rollout undo deployment/devops-backend -n cloudops-devops
            exit 1
          fi
          if ! kubectl rollout status deployment/devops-frontend -n cloudops-devops --timeout=180s; then
            echo "::error::Frontend rollout failed! Triggering automated rollback..."
            kubectl rollout undo deployment/devops-frontend -n cloudops-devops
            exit 1
          fi
          echo "All deployments passed health probes and are active!"

      - name: Deployment Failure Alert
        if: failure()
        run: |
          echo "Automated Rollback was executed successfully. SRE team notified."
